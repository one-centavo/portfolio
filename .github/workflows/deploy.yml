name: Deploy to VPS (CI/CD)

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying via SSH to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            # 1. Paths and Repository Configurations
            TARGET_DIR="/home/${{ secrets.VPS_USER }}/portfolio"
            REPO_URL="https://github.com/one-centavo/portfolio.git"

            # 2. Preparation Funnel: Ensure files exist on the disk
            if [ ! -d "$TARGET_DIR" ]; then
              echo "First deployment: Creating directory and cloning repository..."
              mkdir -p "$TARGET_DIR"
              git clone $REPO_URL "$TARGET_DIR"
              cd "$TARGET_DIR"
            else
              echo "🔄 Continuous deployment: Updating the repository..."
              cd "$TARGET_DIR"
              git pull origin main
            fi

            # 3. Principal Action: Building and Starting the Infrastructure
            echo "🏗️ Building and starting containers in production..."
            docker compose up -d --build

            # 4. Health Check: Ensure the container is up and running
            echo "🔍 Verifying container status..."
            if [ "$(docker container inspect -f '{{.State.Running}}' portfolio-web)" = "true" ]; then
              echo "✅ Container portfolio-web is running successfully!"
            else
              echo "❌ ERROR: Container portfolio-web is not running."
              docker compose logs web
              exit 1
            fi

            echo "✅ Deployment completed successfully!"
